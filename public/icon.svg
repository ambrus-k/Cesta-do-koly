<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <!-- Bus body -->
  <rect x="120" y="110" width="272" height="260" rx="44" fill="url(#busGrad)"/>
  <!-- Front window -->
  <rect x="150" y="145" width="212" height="90" rx="16" fill="#0284c7"/>
  <!-- Destination display -->
  <rect x="180" y="125" width="152" height="14" rx="7" fill="#38bdf8"/>
  <!-- Headlights -->
  <circle cx="165" cy="275" r="18" fill="#fbbf24"/>
  <circle cx="347" cy="275" r="18" fill="#fbbf24"/>
  <!-- Grille -->
  <rect x="216" y="265" width="80" height="20" rx="6" fill="#64748b"/>
  <!-- Wheels -->
  <rect x="144" y="360" width="48" height="40" rx="12" fill="#0f172a"/>
  <rect x="320" y="360" width="48" height="40" rx="12" fill="#0f172a"/>
  <!-- Location pin badge -->
  <circle cx="390" cy="115" r="50" fill="#f43f5e"/>
  <circle cx="390" cy="115" r="22" fill="#ffffff"/>
</svg>
